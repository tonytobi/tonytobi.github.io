<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EconomyGameForKid</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!--
      Full-window template: the game canvas always fills the browser window (desktop and mobile), the loading bar sits
      in the middle, and a button in the corner switches the page to real fullscreen and back. On phones and tablets
      the first tap on the game also enters fullscreen. Pressing Start in the game keeps the screen in landscape (see
      the Landscape section below).
    -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div id="unity-loading-title">EconomyGameForKid</div>
        <div id="unity-progress-bar"><div id="unity-progress-fill"></div></div>
      </div>
      <div id="unity-warning"></div>
      <button id="unity-fullscreen-button" type="button" title="Fullscreen" aria-label="Fullscreen"></button>
      <div id="unity-rotate-hint">
        <div id="unity-rotate-hint-icon"></div>
        <div id="unity-rotate-hint-text"></div>
      </div>
    </div>
    <script>
      var container        = document.querySelector("#unity-container");
      var canvas           = document.querySelector("#unity-canvas");
      var loading          = document.querySelector("#unity-loading");
      var progressFill     = document.querySelector("#unity-progress-fill");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var rotateHint       = document.querySelector("#unity-rotate-hint");
      var rotateHintText   = document.querySelector("#unity-rotate-hint-text");
      // iPadOS reports itself as a Mac, so a Mac with a touch screen is an iPad.
      var isIOS            = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isMobile         = isIOS || /Android/i.test(navigator.userAgent);

      // Shows a message for a few seconds, or a permanent one on top of the canvas for errors.
      function unityShowBanner(message, type) {
        var banner = document.querySelector("#unity-warning");
        function refreshBanner() {
          banner.style.display = banner.children.length ? "block" : "none";
        }
        var line = document.createElement("div");
        line.innerHTML = message;
        banner.appendChild(line);
        if (type == "error") {
          line.style = "background: #e53935; color: white; padding: 10px;";
        } else {
          if (type == "warning") {
            line.style = "background: #ffeb3b; padding: 10px;";
          }
          setTimeout(function () {
            banner.removeChild(line);
            refreshBanner();
          }, 5000);
        }
        refreshBanner();
      }

      // --- Fullscreen -------------------------------------------------------------------------------------------
      // The whole container goes fullscreen (not only the canvas), so this button stays usable to leave it.

      function getFullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function isFullscreenSupported() {
        return !!(container.requestFullscreen || container.webkitRequestFullscreen);
      }

      // Goes fullscreen; onEntered runs once the page is fullscreen (right away when it already is).
      function enterFullscreen(onEntered) {
        if (getFullscreenElement()) {
          if (onEntered) {
            onEntered();
          }
          return;
        }

        var request = container.requestFullscreen || container.webkitRequestFullscreen;
        if (!request) {
          return;
        }

        var result = request.call(container);
        if (result && result.then) {
          result.then(function () {
            if (onEntered) {
              onEntered();
            }
          }).catch(function () { });
        } else if (onEntered) {
          onEntered();
        }
      }

      function exitFullscreen() {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit && getFullscreenElement()) {
          exit.call(document);
        }
      }

      function refreshFullscreenButton() {
        fullscreenButton.classList.toggle("is-fullscreen", !!getFullscreenElement());
      }

      // --- Landscape --------------------------------------------------------------------------------------------
      // The game is made for a landscape screen. Pressing Start in the game calls gameRequestLandscape():
      // - Android: the page goes fullscreen and the rotation is locked to landscape, so turning the phone upright
      //   changes nothing. Browsers only allow the lock while fullscreen; leaving fullscreen releases it.
      // - iPhone: Safari can neither go fullscreen nor lock the rotation, so a "turn your phone" screen covers the
      //   game while the phone is held upright (from the start, the menu is landscape too).
      // Whenever the lock is missing after Start (fullscreen left, lock refused), the same screen shows on Android
      // too, and tapping it asks for fullscreen and the lock again.

      var isLandscapeRequested = false;
      var isLandscapeLocked    = false;

      function isPortrait() {
        return window.innerHeight > window.innerWidth;
      }

      function refreshRotateHint() {
        var isHintNeeded = isMobile && isPortrait() && !isLandscapeLocked && (isIOS || isLandscapeRequested);
        rotateHint.style.display = isHintNeeded ? "flex" : "none";
      }

      function lockLandscape() {
        if (!screen.orientation || !screen.orientation.lock) {
          refreshRotateHint();
          return;
        }

        screen.orientation.lock("landscape").then(function () {
          isLandscapeLocked = true;
          refreshRotateHint();
        }).catch(function () {
          isLandscapeLocked = false;
          refreshRotateHint();
        });
      }

      window.gameRequestLandscape = function () {
        isLandscapeRequested = true;
        if (isMobile && !isIOS) {
          enterFullscreen(lockLandscape);
        }
        refreshRotateHint();
      };

      function onFullscreenChanged() {
        refreshFullscreenButton();
        if (!getFullscreenElement()) {
          isLandscapeLocked = false;
          refreshRotateHint();
        }
      }

      rotateHintText.innerHTML = isIOS
        ? "Hãy xoay ngang điện thoại để chơi nhé!<small>Nếu màn hình không xoay, hãy tắt Khóa xoay màn hình trong Trung tâm điều khiển.</small>"
        : "Hãy xoay ngang điện thoại để chơi nhé!<small>Chạm vào đây để chơi toàn màn hình.</small>";

      // Android: the tap is what lets the browser go fullscreen again.
      rotateHint.addEventListener("click", function () {
        if (isLandscapeRequested && !isIOS) {
          window.gameRequestLandscape();
        }
      });
      window.addEventListener("resize", refreshRotateHint);
      window.addEventListener("orientationchange", refreshRotateHint);
      refreshRotateHint();

      if (isFullscreenSupported()) {
        fullscreenButton.addEventListener("click", function () {
          if (getFullscreenElement()) {
            exitFullscreen();
          } else {
            enterFullscreen();
          }
        });
        document.addEventListener("fullscreenchange", onFullscreenChanged);
        document.addEventListener("webkitfullscreenchange", onFullscreenChanged);

        // Phones: the first tap on the game goes fullscreen (browsers only allow it from a tap).
        if (isMobile) {
          canvas.addEventListener("pointerup", function onFirstTap() {
            canvas.removeEventListener("pointerup", onFirstTap);
            enterFullscreen();
          });
        }
      } else {
        // e.g. Safari on iPhone has no fullscreen for pages: the canvas still fills the window.
        fullscreenButton.style.display = "none";
      }

      // --- Loading ----------------------------------------------------------------------------------------------

      var buildUrl  = "Build";
      var loaderUrl = buildUrl + "/EconomyForKid.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/EconomyForKid.data",
        frameworkUrl: buildUrl + "/EconomyForKid.framework.js",
        codeUrl: buildUrl + "/EconomyForKid.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "EconomyGameForKid",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Phones: render at most at 2x the CSS size, sharp enough while keeping the frame rate up.
      if (isMobile) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      loading.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressFill.style.width = 100 * progress + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
