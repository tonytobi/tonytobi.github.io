<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EconomyGameForKid</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <!--
      Full-window template: the game canvas always fills the browser window (desktop and mobile), the loading bar sits
      in the middle, and a button in the corner switches the page to real fullscreen and back. On phones and tablets
      the first tap on the game also enters fullscreen and keeps the screen in portrait where the browser allows it.
    -->
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div id="unity-loading-title">EconomyGameForKid</div>
        <div id="unity-progress-bar"><div id="unity-progress-fill"></div></div>
      </div>
      <div id="unity-warning"></div>
      <button id="unity-fullscreen-button" type="button" title="Fullscreen" aria-label="Fullscreen"></button>
    </div>
    <script>
      var container        = document.querySelector("#unity-container");
      var canvas           = document.querySelector("#unity-canvas");
      var loading          = document.querySelector("#unity-loading");
      var progressFill     = document.querySelector("#unity-progress-fill");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var isMobile         = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

      // Shows a message for a few seconds, or a permanent one on top of the canvas for errors.
      function unityShowBanner(message, type) {
        var banner = document.querySelector("#unity-warning");
        function refreshBanner() {
          banner.style.display = banner.children.length ? "block" : "none";
        }
        var line = document.createElement("div");
        line.innerHTML = message;
        banner.appendChild(line);
        if (type == "error") {
          line.style = "background: #e53935; color: white; padding: 10px;";
        } else {
          if (type == "warning") {
            line.style = "background: #ffeb3b; padding: 10px;";
          }
          setTimeout(function () {
            banner.removeChild(line);
            refreshBanner();
          }, 5000);
        }
        refreshBanner();
      }

      // --- Fullscreen -------------------------------------------------------------------------------------------
      // The whole container goes fullscreen (not only the canvas), so this button stays usable to leave it.

      function getFullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function isFullscreenSupported() {
        return !!(container.requestFullscreen || container.webkitRequestFullscreen);
      }

      function enterFullscreen() {
        var request = container.requestFullscreen || container.webkitRequestFullscreen;
        if (!request || getFullscreenElement()) {
          return;
        }

        var result = request.call(container);
        if (result && result.then) {
          result.then(lockPortrait).catch(function () { });
        } else {
          lockPortrait();
        }
      }

      function exitFullscreen() {
        var exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit && getFullscreenElement()) {
          exit.call(document);
        }
      }

      // The game is made for a portrait screen; browsers only allow locking it while in fullscreen.
      function lockPortrait() {
        if (isMobile && screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("portrait").catch(function () { });
        }
      }

      function refreshFullscreenButton() {
        fullscreenButton.classList.toggle("is-fullscreen", !!getFullscreenElement());
      }

      if (isFullscreenSupported()) {
        fullscreenButton.addEventListener("click", function () {
          if (getFullscreenElement()) {
            exitFullscreen();
          } else {
            enterFullscreen();
          }
        });
        document.addEventListener("fullscreenchange", refreshFullscreenButton);
        document.addEventListener("webkitfullscreenchange", refreshFullscreenButton);

        // Phones: the first tap on the game goes fullscreen (browsers only allow it from a tap).
        if (isMobile) {
          canvas.addEventListener("pointerup", function onFirstTap() {
            canvas.removeEventListener("pointerup", onFirstTap);
            enterFullscreen();
          });
        }
      } else {
        // e.g. Safari on iPhone has no fullscreen for pages: the canvas still fills the window.
        fullscreenButton.style.display = "none";
      }

      // --- Loading ----------------------------------------------------------------------------------------------

      var buildUrl  = "Build";
      var loaderUrl = buildUrl + "/EconomyForKid.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/EconomyForKid.data.unityweb",
        frameworkUrl: buildUrl + "/EconomyForKid.framework.js.unityweb",
        codeUrl: buildUrl + "/EconomyForKid.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "EconomyGameForKid",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // Phones: render at most at 2x the CSS size, sharp enough while keeping the frame rate up.
      if (isMobile) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }

      loading.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressFill.style.width = 100 * progress + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
